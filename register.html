<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="css/style.css" rel="stylesheet" />
    <script src="js/script.js?v=5" defer></script>
    <title>Bug Tracker - Create Account</title>
    <link rel="icon" href="images/bug-logo.png" type="image/png" />
</head>

<body id="page-register" class="bg-background-dark font-display antialiased flex items-center justify-center p-4">
    <div class="w-full max-w-md relative">
        <!-- Background decorative blurs -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-orange-500/10 rounded-full blur-3xl"></div>
        <!-- Main Card -->
        <div class="glossy-card rounded-2xl p-8 relative overflow-hidden">
            <!-- Logo/Icon Section -->
            <div class="flex flex-col items-center mb-8">
                <div
                    class="w-20 h-20 btn-gradient rounded-2xl flex items-center justify-center mb-5 shadow-2xl relative">
                    <div class="absolute inset-0 rounded-2xl bg-white/10 opacity-50"></div>
                    <span class="material-symbols-outlined text-white relative z-10 text-[48px]"
                        style="font-variation-settings: 'FILL' 1;">person_add</span>
                </div>
                <h1 class="text-4xl font-bold text-white tracking-tight">Create Account</h1>
                <p class="text-slate-400 mt-3 text-center text-sm font-medium">Join Bug Tracker — start tracking issues
                </p>
            </div>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-5" novalidate>
                <!-- Full Name -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1"
                        for="reg-name">Full Name</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">person</span>
                        </div>
                        <input
                            class="input-gloss block w-full pl-12 pr-4 py-3.5 rounded-xl text-black placeholder-slate-400 focus:outline-none transition-all text-sm"
                            id="reg-name" name="name" placeholder="John Doe" type="text" required />
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1"
                        for="reg-email">Email Address</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">mail</span>
                        </div>
                        <input
                            class="input-gloss block w-full pl-12 pr-4 py-3.5 rounded-xl text-black placeholder-slate-400 focus:outline-none transition-all text-sm"
                            id="reg-email" name="email" placeholder="name@company.com" type="email" required />
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1"
                        for="reg-password">Password</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">lock</span>
                        </div>
                        <input
                            class="input-gloss block w-full pl-12 pr-12 py-3.5 rounded-xl text-black placeholder-slate-400 focus:outline-none transition-all text-sm"
                            id="reg-password" name="password" placeholder="Min. 6 characters" type="password"
                            required />
                        <button id="reg-toggle-password"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300 transition-colors"
                            type="button" title="Show/hide password" aria-label="Toggle password visibility">
                            <span id="reg-eye-icon" class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                    <p class="text-xs text-slate-600 ml-1">Password must be at least 6 characters</p>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1"
                        for="reg-confirm">Confirm Password</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">lock_reset</span>
                        </div>
                        <input
                            class="input-gloss block w-full pl-12 pr-12 py-3.5 rounded-xl text-black placeholder-slate-400 focus:outline-none transition-all text-sm"
                            id="reg-confirm" name="confirm" placeholder="Repeat password" type="password" required />
                        <button id="reg-toggle-confirm"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300 transition-colors"
                            type="button" title="Show/hide confirm password"
                            aria-label="Toggle confirm password visibility">
                            <span id="reg-confirm-eye-icon" class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Role -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1"
                        for="reg-role">Role</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">badge</span>
                        </div>
                        <select
                            class="input-gloss block w-full pl-12 pr-4 py-3.5 rounded-xl text-black focus:outline-none transition-all text-sm appearance-none"
                            id="reg-role" name="role">
                            <option value="Reporter">Reporter</option>
                            <option value="Developer">Developer</option>
                            <option value="Admin">Admin</option>
                        </select>
                        <div
                            class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-500">
                            <span class="material-symbols-outlined text-xl">expand_more</span>
                        </div>
                    </div>
                </div>

                <!-- Error message area -->
                <div id="register-error"
                    class="hidden text-red-400 text-sm rounded-xl bg-red-500/10 border border-red-500/20 px-4 py-3 flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg flex-shrink-0">error</span>
                    <span id="register-error-text"></span>
                </div>

                <!-- Submit Button -->
                <button id="register-btn"
                    class="btn-gradient w-full py-4 px-6 text-white font-bold rounded-xl text-base tracking-wide transition-all active:scale-[0.98] mt-2"
                    type="submit">
                    Create Account
                </button>
            </form>

            <!-- Bottom Link -->
            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-sm text-slate-400">
                    Already have an account?
                    <a class="font-bold text-primary hover:text-orange-400 ml-1 transition-colors"
                        href="index.html">Sign In</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-10 text-center">
            <div
                class="inline-flex items-center space-x-3 text-slate-500 text-[11px] font-medium uppercase tracking-widest">
                <span>© 2024 Bug Tracker Systems</span>
                <span class="w-1.5 h-1.5 bg-slate-700 rounded-full"></span>
                <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
            </div>
        </div>
    </div>
</body>

</html>
