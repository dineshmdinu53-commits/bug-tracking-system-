<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bug Tracker - Report Bug</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <script src="js/script.js?v=5" defer></script>
    <link rel="icon" href="images/bug-logo.png" type="image/png" />
</head>

<body id="page-create-bug" class="dark:bg-background-dark text-slate-100 min-h-screen font-display">
    <div
        class="flex flex-col min-h-screen border-x border-slate-800 bg-background-dark shadow-2xl relative overflow-hidden">
        <!-- Subtle glow effects background -->
        <div
            class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-primary/10 blur-[120px] pointer-events-none">
        </div>

        <!-- Top Navigation Bar -->
        <nav class="border-b border-slate-800 bg-background-dark/80 backdrop-blur-md sticky top-0 z-50 w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-8">
                        <div class="flex items-center gap-2">
                            <div class="bg-primary-gradient p-1.5 rounded-lg">
                                <span class="material-symbols-outlined text-white text-[24px]"
                                    style="font-variation-settings: 'FILL' 1;">bug_report</span>
                            </div>
                            <span class="text-xl font-bold tracking-tight text-white hidden sm:block">Bug Tracker</span>
                        </div>
                        <div class="hidden md:flex items-center gap-8">
                            <a class="text-slate-400 hover:text-white transition-colors py-5"
                                href="dashboard.html">Dashboard</a>
                            <a class="text-slate-400 hover:text-white transition-colors py-5"
                                href="bug-list.html">Bugs</a>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="relative hidden sm:block">
                            <span
                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">search</span>
                            <input
                                class="bg-slate-900 border-slate-700 text-xs rounded-full pl-9 pr-4 py-1.5 w-48 focus:ring-primary focus:border-primary"
                                placeholder="Search..." type="text" />
                        </div>
                        <a class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors"
                            href="index.html">
                            <span class="material-symbols-outlined">logout</span>
                            <span class="font-medium text-sm hidden sm:block">Logout</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-6 space-y-8 relative z-10 max-w-2xl w-full mx-auto mt-4">
            <div class="space-y-1">
                <h2 class="text-3xl font-bold text-white tracking-tight">New Bug Report</h2>
                <p class="text-slate-400 text-sm">Fill in the details below to notify the engineering team.</p>
            </div>
            <form id="create-bug-form" class="space-y-6">
                <!-- Bug Title -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Bug Title</label>
                    <div class="glossy-card rounded-xl p-[1px]">
                        <input type="text" id="bug-title" placeholder="e.g., Cannot login with valid credentials"
                            class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-600"
                            required>
                    </div>
                </div>
                <!-- Bug Description -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Bug
                        Description</label>
                    <div class="glossy-card rounded-xl p-[1px]">
                        <textarea id="bug-description"
                            class="w-full p-4 rounded-xl border-none bg-surface-dark text-slate-100 focus:ring-2 focus:ring-primary transition-all placeholder:text-slate-500 resize-none"
                            placeholder="Describe the steps to reproduce the issue..." rows="4" required></textarea>
                    </div>
                </div>
                <!-- Code Snippet -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Code Snippet</label>
                    <div class="glossy-card rounded-xl p-[1px]">
                        <textarea id="bug-code"
                            class="w-full p-4 rounded-xl border-none bg-[#0d1117] text-green-400 font-mono focus:ring-2 focus:ring-primary transition-all placeholder:text-slate-600 resize-none text-sm"
                            placeholder="Paste any related code snippet here (optional)..." rows="6"></textarea>
                    </div>
                </div>
                <!-- Two Column Row: Priority & Assignee -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Priority</label>
                        <div class="glossy-card rounded-xl p-[1px]">
                            <select id="bug-priority"
                                class="w-full h-14 px-4 rounded-xl border-none bg-surface-dark text-slate-100 focus:ring-2 focus:ring-primary transition-all appearance-none">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Assign
                            Developer</label>
                        <div class="glossy-card rounded-xl p-[1px]">
                            <select id="bug-assignee"
                                class="w-full h-14 px-4 rounded-xl border-none bg-surface-dark text-slate-100 focus:ring-2 focus:ring-primary transition-all appearance-none">
                                <option value="">Loading developers...</option>
                            </select>
                        </div>
                    </div>
                </div>
                <!-- Upload Screenshot -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Upload Bug
                        Screenshot</label>
                    <div class="relative group">
                        <div
                            class="w-full h-32 border border-dashed border-slate-700 rounded-xl glossy-card flex flex-col items-center justify-center space-y-2 group-hover:border-primary/50 transition-colors cursor-pointer">
                            <span class="material-symbols-outlined text-primary text-3xl">add_photo_alternate</span>
                            <span class="text-xs text-slate-400">Click to upload or drag and drop</span>
                        </div>
                        <input id="bug-screenshot" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                            type="file" accept="image/*" />
                    </div>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full h-14 mt-4 rounded-xl font-bold text-white primary-gradient shadow-[0_10px_20px_-5px_rgba(236,72,153,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 border border-white/10"
                    type="submit">
                    <span class="material-symbols-outlined">pest_control</span>
                    Submit Bug Report
                </button>
            </form>
            <!-- Bottom Spacer -->
            <div class="h-24"></div>
        </main>

        <!-- Bottom Navigation Bar (Mobile) -->
        <div
            class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-6 py-4 flex justify-around items-center z-50">
            <a class="flex flex-col items-center gap-1 text-slate-500 hover:text-primary transition-colors"
                href="dashboard.html">
                <span class="material-symbols-outlined">grid_view</span>
                <span class="text-[10px] font-bold">Dashboard</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-primary" href="create-bug.html">
                <span class="material-symbols-outlined">add_circle</span>
                <span class="text-[10px] font-bold">Create</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-slate-500 hover:text-primary transition-colors"
                href="bug-list.html">
                <span class="material-symbols-outlined">pest_control</span>
                <span class="text-[10px] font-bold">Bugs</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-slate-500 hover:text-primary transition-colors"
                href="bug-report.html">
                <span class="material-symbols-outlined">analytics</span>
                <span class="text-[10px] font-bold">Reports</span>
            </a>
        </div>
    </div>
</body>

</html>
