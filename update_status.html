<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bug Tracker - Update Bug Status</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <script src="js/script.js?v=5" defer></script>
    <link rel="icon" href="images/bug-logo.png" type="image/png" />
</head>
<body id="page-update-status" class="dark:bg-background-dark text-slate-100 min-h-screen font-display">
    <div class="flex flex-col min-h-screen border-x border-slate-800 bg-background-dark shadow-2xl relative overflow-hidden">
        
        <!-- Subtle glow effects background -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-primary/10 blur-[120px] pointer-events-none"></div>

        <!-- Top Navigation Bar -->
        <nav class="border-b border-slate-800 bg-background-dark/80 backdrop-blur-md sticky top-0 z-50 w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-8">
                        <div class="flex items-center gap-2">
                            <div class="bg-primary-gradient p-1.5 rounded-lg">
                                <span class="material-symbols-outlined text-white text-[24px]" style="font-variation-settings: 'FILL' 1;">bug_report</span>
                            </div>
                            <span class="text-xl font-bold tracking-tight text-white hidden sm:block">Bug Tracker</span>
                        </div>
                        <div class="hidden md:flex items-center gap-8">
                            <a class="text-slate-400 hover:text-white transition-colors py-5" href="dashboard.html">Dashboard</a>
                            <a class="text-slate-400 hover:text-white transition-colors py-5" href="bug-list.html">Bugs</a>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="relative hidden sm:block">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">search</span>
                            <input class="bg-slate-900 border-slate-700 text-xs rounded-full pl-9 pr-4 py-1.5 w-48 focus:ring-primary focus:border-primary" placeholder="Search..." type="text" />
                        </div>
                        <a class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors" href="index.html">
                            <span class="material-symbols-outlined">logout</span>
                            <span class="font-medium text-sm hidden sm:block">Logout</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-6 space-y-8 relative z-10 max-w-lg w-full mx-auto mt-12">
            <div class="space-y-1 text-center">
                <h2 class="text-3xl font-bold text-white tracking-tight">Update Bug Status <span id="display-bug-id" class="text-primary">#...</span></h2>
                <p class="text-slate-400 text-sm">Select a new status for this bug.</p>
            </div>
            
            <!-- Message Container -->
            <div id="message-container" class="hidden p-4 rounded-xl text-sm font-medium text-center border"></div>

            <form id="update-status-form" class="space-y-6">
                <!-- Select Status -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">New Status</label>
                    <div class="glossy-card rounded-xl p-[1px]">
                        <select id="bug-status" class="w-full h-14 px-4 rounded-xl border-none bg-white text-black focus:ring-2 focus:ring-primary transition-all appearance-none" required>
                            <option value="" class="text-black bg-white">-- Choose Status --</option>
                            <option value="Open" class="text-black bg-white">Open</option>
                            <option value="In Progress" class="text-black bg-white">In Progress</option>
                            <option value="Closed" class="text-black bg-white">Closed</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <button class="w-full h-14 mt-4 rounded-xl font-bold text-white primary-gradient shadow-[0_10px_20px_-5px_rgba(236,72,153,0.4)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 border border-white/10" type="submit" id="submit-btn">
                    <span class="material-symbols-outlined">update</span>
                    Update Status
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="bug-list.html" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Back to Bug List</a>
            </div>
        </main>
    </div>

    <!-- Page JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bugId = urlParams.get('bug_id');
            const displayBugId = document.getElementById('display-bug-id');
            const statusSelect = document.getElementById('bug-status');
            const updateStatusForm = document.getElementById('update-status-form');
            const messageContainer = document.getElementById('message-container');
            const submitBtn = document.getElementById('submit-btn');

            if (bugId) {
                displayBugId.textContent = '#' + bugId;
            } else {
                displayBugId.textContent = '(ID Missing)';
                showMessage('Error: Bug ID is missing in URL.', 'error');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            // Handle form submit
            updateStatusForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                if (!bugId) return;

                const status = statusSelect.value;
                if (!status) {
                    showMessage('Please select a status.', 'error');
                    return;
                }

                // Show loading state
                const originalBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Updating...';
                submitBtn.disabled = true;

                const formData = new FormData();
                formData.append('bug_id', bugId);
                formData.append('status', status);

                fetch('php/update_status.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json().catch(() => {
                    throw new Error('Invalid server response');
                }))
                .then(data => {
                    if (data.status === 'success') {
                        showMessage(data.message || 'Status updated successfully.', 'success');
                    } else {
                        showMessage(data.message || 'Error updating bug status.', 'error');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showMessage('Network or server error occurred.', 'error');
                })
                .finally(() => {
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                });
            });

            function showMessage(text, type) {
                messageContainer.textContent = text;
                messageContainer.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/20', 'text-red-400', 'bg-green-500/10', 'border-green-500/20', 'text-green-400');
                
                if (type === 'success') {
                    messageContainer.classList.add('bg-green-500/10', 'border-green-500/20', 'text-green-400');
                } else {
                    messageContainer.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-400');
                }
            }
        });
    </script>
</body>
</html>
