<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="css/style.css" rel="stylesheet" />
    <script src="js/script.js?v=5" defer></script>
    <title>Bug Tracker - Login</title>
    <link rel="icon" href="images/bug-logo.png" type="image/png" />
</head>

<body id="page-login" class="bg-background-dark font-display antialiased flex items-center justify-center p-4">
    <div class="w-full max-w-md relative">
        <!-- Background decorative blurs -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-orange-500/10 rounded-full blur-3xl"></div>
        <!-- Main Login Card -->
        <div class="glossy-card rounded-2xl p-8 relative overflow-hidden">
            <!-- Logo/Icon Section -->
            <div class="flex flex-col items-center mb-10">
                <div
                    class="w-20 h-20 btn-gradient rounded-2xl flex items-center justify-center mb-5 shadow-2xl relative">
                    <!-- Subtle inner glow for glossy look -->
                    <div class="absolute inset-0 rounded-2xl bg-white/10 opacity-50"></div>
                    <span class="material-symbols-outlined text-white relative z-10 text-[48px]"
                        style="font-variation-settings: 'FILL' 1;">bug_report</span>
                </div>
                <h1 class="text-4xl font-bold text-white tracking-tight">Bug Tracker</h1>
                <p class="text-slate-400 mt-3 text-center text-sm font-medium">Identify. Track. Resolve.</p>
            </div>
            <!-- Form Section -->
            <form id="loginForm" class="space-y-6">
                <!-- Email Input -->
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1" for="email">Email
                        Address</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">mail</span>
                        </div>
                        <input
                            class="input-gloss block w-full pl-12 pr-4 py-3.5 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none transition-all text-sm"
                            id="email" name="email" placeholder="name@company.com" type="email" required />
                    </div>
                </div>
                <!-- Password Input -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between ml-1">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
                            for="password">Password</label>
                        <a class="text-xs font-bold text-primary hover:text-orange-400 transition-colors"
                            href="#">Forgot password?</a>
                    </div>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl">lock</span>
                        </div>
                        <input
                            class="input-gloss block w-full pl-12 pr-12 py-3.5 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none transition-all text-sm"
                            id="password" name="password" placeholder="••••••••" type="password" required />
                        <button id="login-toggle-password"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300 transition-colors"
                            type="button" title="Show/hide password" aria-label="Toggle password visibility">
                            <span id="login-eye-icon" class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Remember Me -->
                <div class="flex items-center space-x-3 ml-1">
                    <div class="relative flex items-center">
                        <input
                            class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-primary focus:ring-primary focus:ring-offset-slate-900 transition-all cursor-pointer"
                            id="remember" type="checkbox" />
                    </div>
                    <label class="text-sm text-slate-400 cursor-pointer select-none" for="remember">Keep me signed
                        in</label>
                </div>
                <!-- Login Button -->
                <button
                    class="btn-gradient w-full py-4 px-6 text-white font-bold rounded-xl text-base tracking-wide transition-all active:scale-[0.98] mt-4"
                    type="submit">
                    Sign In to Dashboard
                </button>
            </form>
            <!-- Bottom Links -->
            <div class="mt-10 pt-8 border-t border-white/5 text-center">
                <p class="text-sm text-slate-400">
                    Don't have an account?
                    <a class="font-bold text-primary hover:text-orange-400 ml-1 transition-colors" href="register.html">Create
                        account</a>
                </p>
            </div>
        </div>
        <!-- Footer Elements -->
        <div class="mt-10 text-center">
            <div
                class="inline-flex items-center space-x-3 text-slate-500 text-[11px] font-medium uppercase tracking-widest">
                <span>© 2024 Bug Tracker Systems</span>
                <span class="w-1.5 h-1.5 bg-slate-700 rounded-full"></span>
                <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
            </div>
        </div>
    </div>
</body>

</html>
